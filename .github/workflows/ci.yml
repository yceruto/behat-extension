name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  tests:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - 8.1
          - 8.3
        behat:
          - ^3.17
        deps:
          - highest
        include:
          # Behat 4 requires PHP >= 8.2, so it only runs on the newer PHP of the matrix
          - php: 8.3
            behat: ^4.0
            deps: highest
          # and one run pinned to the floor of the constraint
          - php: 8.3
            behat: ^3.17
            deps: lowest

    steps:
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        ini-values: zend.assertions=1

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Validate composer.json and composer.lock
      run: composer validate --strict


    - name: Install dependencies
      run: |
        composer require "behat/behat:${{ matrix.behat }}" --no-update --no-interaction
        composer update --classmap-authoritative --no-interaction ${{ matrix.deps == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

    - name: Run tests
      run: vendor/bin/behat
